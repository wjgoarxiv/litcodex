name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies (clean, locked)
        run: npm ci --ignore-scripts

      - name: Assert CI workflow integrity
        run: npm run check:ci

      - name: Verify lock-owned Codex CLI
        run: npm run qa:codex-host-locked

      - name: Typecheck
        run: npm run typecheck

      - name: Test typecheck
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Documentation and contract audit
        run: npm run docs:audit

      - name: Codex hook QA
        run: npm run qa:codex

      - name: Path-robustness QA
        run: npm run qa:path-robustness

      - name: Lit-loop smoke QA
        run: npm run qa:loop-smoke

      - name: Public page reader A/B QA
        run: npm run qa:lit-fetch-ab

      - name: Legacy-token scan
        run: npm run scan:legacy-tokens

      - name: Build
        run: npm run build

      - name: Packed install QA
        run: npm run qa:install-smoke

      - name: Credentialless installed doctor QA
        env:
          CODEX_BIN: ${{ github.workspace }}/node_modules/.bin/codex
        run: npm run qa:uiux-installed:doctor

      - name: Pack dry-run (payload guard)
        run: npm run pack:all

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        id: windows_checkout

      - name: Use Node.js 22
        id: windows_setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (clean, locked)
        id: windows_install
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Build
        id: windows_build
        shell: pwsh
        run: npm run build

      - name: Unit & integration tests
        id: windows_tests
        shell: pwsh
        run: npm test

      - name: Native codex.ps1-only PATH QA
        id: windows_path_qa
        shell: pwsh
        run: node scripts/qa-windows-codex-ps1.mjs

      - name: Windows support summary
        if: always()
        shell: pwsh
        run: |
          $statuses = @("${{ steps.windows_checkout.outcome }}", "${{ steps.windows_setup.outcome }}", "${{ steps.windows_install.outcome }}", "${{ steps.windows_build.outcome }}", "${{ steps.windows_tests.outcome }}", "${{ steps.windows_path_qa.outcome }}"); if (($statuses | Where-Object { $_ -ne "success" }).Count -eq 0) { "Windows support (non-blocking): PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append } else { "Windows support (non-blocking): FAIL — a Windows job step failed; inspect the job steps." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }

      # Omitted here and covered by the Ubuntu verify matrix (or its Unix-oriented surface):
      # check:workspaces, typecheck, typecheck:tests, lint, docs:audit,
      # qa:lit-fetch-ab, scan:legacy-tokens, and check:marketplace-dist.

  performance:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (clean, locked)
        run: npm ci --ignore-scripts

      - name: Performance tests
        id: performance_tests
        continue-on-error: true
        run: npm run test:performance

      - name: Performance test summary
        if: always()
        run: |
          if [ "${{ steps.performance_tests.outcome }}" = "success" ]; then echo "Performance checks (non-blocking): PASS" >> "$GITHUB_STEP_SUMMARY"; else echo "Performance checks (non-blocking): FAIL — inspect the performance job steps." >> "$GITHUB_STEP_SUMMARY"; fi
