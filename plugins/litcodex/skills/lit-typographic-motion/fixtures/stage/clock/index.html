<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lit/fonts.css"><script src="/lit/stage-kit.js"></script>
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #101418; color: #EEF2F4; font: 400 44px "Archivo"; }
#readout { position: absolute; left: 160px; top: 160px; white-space: pre; line-height: 1.5; }
.spin { position: absolute; left: 1400px; top: 500px; width: 160px; height: 160px; background: #4FB0A0; animation: spin 1.5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style></head>
<body>
<p id="copy" style="position:absolute;left:760px;top:60px;margin:0;font:700 64px Archivo;color:#FFFFFF;text-shadow:0 2px 12px #000">Tide pool at noon</p>
<div id="readout"></div>
<div class="spin"></div>
<svg width="400" height="200" style="position:absolute;left:1300px;top:780px"><circle cx="40" cy="100" r="30" fill="#F2B84B"><animate attributeName="cx" from="40" to="360" dur="2s" repeatCount="indefinite"/></circle></svg>
<canvas id="c" width="600" height="200" style="position:absolute;left:160px;top:760px"></canvas>
<script>
const readout = document.getElementById("readout");
const ctx = document.getElementById("c").getContext("2d");
let ticks = 0;
let rafTime = 0;
setInterval(() => ticks++, 250);
function loop(ts) { rafTime = ts; requestAnimationFrame(loop); }
requestAnimationFrame(loop);
LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4, render(t) {
	readout.textContent = [
		`t ${t.toFixed(3)}`,
		`Date.now ${Date.now()}`,
		`perf ${performance.now().toFixed(1)}`,
		`timeline ${document.timeline.currentTime.toFixed(1)}`,
		`raf ${rafTime.toFixed(1)} ticks ${ticks}`,
		`random ${Math.random().toFixed(6)}`,
	].join("\n");
	ctx.clearRect(0, 0, 600, 200);
	ctx.fillStyle = "#E86A5C";
	ctx.fillRect(20 + 400 * LitStage.ease.inOutSine((t % 2) / 2), 60, 120, 80);
} });
</script></body></html>
