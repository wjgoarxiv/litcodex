<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lit/fonts.css"><script src="/lit/stage-kit.js"></script>
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #2A2A2A; font-family: "Archivo"; }
.t { position: absolute; margin: 0; font-weight: 700; }
#dim { left: 700px; top: 300px; font-size: 64px; color: #333333; }
#edge { left: 8px; top: 520px; font-size: 48px; color: #FFFFFF; }
#flash { left: 700px; top: 760px; font-size: 56px; color: #FFFFFF; opacity: 0; }
#meta { left: 700px; top: 900px; font-size: 40px; color: #FFFFFF; }
#decorcopy { left: 1300px; top: 120px; font-size: 40px; color: #FFFFFF; }
svg { position: absolute; left: 1500px; top: 600px; color: #F2C14E; }
canvas { position: absolute; left: 120px; top: 80px; }
</style></head>
<body>
<p class="t" id="dim">Quiet harbor</p>
<p class="t" id="edge">Edge of frame</p>
<p class="t" id="flash">Blink line</p>
<p class="t" id="meta">treatment beat 2</p>
<p class="t" id="decorcopy">Quiet harbor</p>
<svg width="200" height="200"><circle cx="100" cy="100" r="80" fill="currentColor"/></svg>
<canvas id="c" width="400" height="120"></canvas>
<script>
const COPY = { a: "Quiet harbor", b: "Edge of frame", c: "Blink line" };
LitStage.text(document.getElementById("decorcopy"), { decor: true });
const ctx = document.getElementById("c").getContext("2d");
const flash = document.getElementById("flash");
LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4, render(t) {
	flash.style.opacity = t >= 2.0 && t < 2.3 ? "1" : "0";
	document.querySelector("svg").style.opacity = t < 1.3 ? "1" : "0";
	ctx.clearRect(0, 0, 400, 120);
	ctx.fillStyle = "#FFFFFF";
	ctx.font = "700 48px Archivo";
	ctx.fillText("unregistered", 10, 70);
} });
</script></body></html>
