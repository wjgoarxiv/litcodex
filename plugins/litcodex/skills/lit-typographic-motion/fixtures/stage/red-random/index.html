<!doctype html>
<html><head><meta charset="utf-8"><script src="/lit/stage-kit.js"></script>
<style>html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #111; } #v { position: absolute; left: 400px; top: 300px; width: 1100px; height: 480px; }</style></head>
<body><div id="v"></div>
<script>
const v = document.getElementById("v");
LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4, render(t) { const b = crypto.getRandomValues(new Uint8Array(3)); v.style.background = `rgb(${b[0]}, ${b[1]}, ${b[2]})`; } });
