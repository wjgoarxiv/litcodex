<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<script src="/lit/clips.js"></script>
<style>
	html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
	#layer { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="layer"></div>
<p id="copy" style="position:absolute;left:150px;top:860px;margin:0;z-index:2;font:700 64px Archivo;color:#f2f4f7">Tide pool at noon</p>
<script>
	LitStage.text(document.getElementById("copy"));
	// A declared clip stretched over the whole frame that alternates white and black every frame.
	const show = LitStage.keyedClip({ parent: document.getElementById("layer"), id: "strobe", box: { x: 0, y: 0, w: 1920, h: 1080 } });
	LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4, render(t) { show(t, { start: 0, loop: true }); } });
</script>
</body>
</html>
